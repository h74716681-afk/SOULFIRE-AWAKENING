<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090b14">
<title>SOULFIRE: AWAKENING — Prototype</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a12;touch-action:none}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;color:#f5f7ff}.top{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-weight:900;letter-spacing:.16em;font-size:13px;text-shadow:0 2px 12px #000}.sub{font-size:10px;color:#aeb6d1;letter-spacing:.18em;margin-top:4px}.status{font-size:11px;color:#b9c4e6;text-align:right}.health{width:145px;height:7px;background:#303348;border-radius:9px;margin-top:7px;overflow:hidden}.health i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#ff3d62,#ff9b62)}
#hint{position:absolute;top:76px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.12em;color:#c4cbe0;background:#101525b8;padding:8px 12px;border:1px solid #ffffff18;border-radius:20px;white-space:nowrap}
.controls{position:absolute;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px}.stick{width:116px;height:116px;border:1px solid #b6c7ff70;border-radius:50%;background:#11182b99;position:relative;pointer-events:auto;touch-action:none;backdrop-filter:blur(8px)}.nub{position:absolute;width:48px;height:48px;border-radius:50%;left:33px;top:33px;background:#a9bbff55;border:1px solid #d8e1ffbb;box-shadow:0 0 20px #809dff55}
.actions{display:flex;gap:12px;align-items:flex-end;pointer-events:auto}.action{border:1px solid #b8c9ff88;background:#141c31d9;color:#fff;border-radius:50%;width:66px;height:66px;font-weight:800;font-size:11px;letter-spacing:.08em;touch-action:none;box-shadow:0 0 22px #607cff22}.action.big{width:78px;height:78px;border-color:#ff875c;background:#4a1e27dd;box-shadow:0 0 25px #ff563944}.action:active{transform:scale(.94);background:#34436a}
#toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-weight:900;letter-spacing:.2em;font-size:22px;color:#ffb08b;text-shadow:0 0 22px #ff572e;opacity:0;transition:opacity .15s;white-space:nowrap}
@media(min-width:800px){.controls{padding:0 6vw}.stick{width:130px;height:130px}.nub{left:40px;top:40px}}
</style>
</head>
<body>
<div id="hud">
 <div class="top"><div><div class="brand">SOULFIRE <span style="color:#ff895f">: AWAKENING</span></div><div class="sub">MOBILE COMBAT PROTOTYPE</div></div><div class="status">PLAYER HP<div class="health"><i id="playerHp"></i></div><div style="margin-top:8px">ENEMY HP<div class="health"><i id="enemyHp" style="background:linear-gradient(90deg,#ff5478,#ffb16b)"></i></div></div><div id="combo" style="margin-top:7px;color:#ffb08b;font-weight:900;letter-spacing:.12em"></div></div></div>
 <div id="hint">MOVE · ATTACK COMBOS · DODGE ENEMY STRIKES</div>
 <div id="toast">SOUL STRIKE</div>
 <div class="controls"><div class="stick" id="stick"><div class="nub" id="nub"></div></div><div class="actions"><button class="action" id="dodge">DODGE</button><button class="action big" id="attack">ATTACK</button></div></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x080b16);scene.fog=new THREE.Fog(0x080b16,18,55);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,100);camera.position.set(0,5,8);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9eafff,0x17111f,2));
const key=new THREE.DirectionalLight(0xffd4b3,3);key.position.set(-5,9,6);key.castShadow=true;scene.add(key);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x171b2a,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(80,80,0x4a527b,0x252c45);grid.position.y=.012;scene.add(grid);
for(let i=0;i<14;i++){const a=i*Math.PI*2/14;const pillar=new THREE.Mesh(new THREE.CylinderGeometry(.28,.42,3.8,8),new THREE.MeshStandardMaterial({color:0x252b42,metalness:.35,roughness:.6}));pillar.position.set(Math.cos(a)*10,1.9,Math.sin(a)*10);pillar.castShadow=true;scene.add(pillar);const ring=new THREE.Mesh(new THREE.TorusGeometry(.55,.045,8,24),new THREE.MeshBasicMaterial({color:0x7a8fff}));ring.rotation.x=Math.PI/2;ring.position.set(pillar.position.x,3.4,pillar.position.z);scene.add(ring)}
const player=new THREE.Group();scene.add(player);
const armorMat=new THREE.MeshStandardMaterial({color:0x26304b,metalness:.62,roughness:.3});
const lightArmor=new THREE.MeshStandardMaterial({color:0xd9e3f8,metalness:.38,roughness:.28});
const skinMat=new THREE.MeshStandardMaterial({color:0xe7b99c,roughness:.72});
const hairMat=new THREE.MeshStandardMaterial({color:0x101827,metalness:.18,roughness:.34});
const glowMat=new THREE.MeshBasicMaterial({color:0xff714b});
function warriorPart(geometry,material,x,y,z,rx=0,ry=0,rz=0){const m=new THREE.Mesh(geometry,material);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);m.castShadow=true;player.add(m);return m}
const body=warriorPart(new THREE.CapsuleGeometry(.37,.72,5,10),armorMat,0,1.38,0);
warriorPart(new THREE.BoxGeometry(.72,.22,.48),lightArmor,0,1.58,-.025);
warriorPart(new THREE.SphereGeometry(.13,16,12),glowMat,0,1.38,-.39);
warriorPart(new THREE.SphereGeometry(.255,18,14),skinMat,0,2.12,-.015);
warriorPart(new THREE.SphereGeometry(.28,16,12),hairMat,0,2.29,.025,.18,0,0);
for(let i=0;i<5;i++){const x=(i-2)*.105;warriorPart(new THREE.ConeGeometry(.105,.34,5),hairMat,x,2.43,-.035,0,0,(i-2)*-.16)}
warriorPart(new THREE.BoxGeometry(.3,.045,.035),hairMat,0,2.12,-.25);
warriorPart(new THREE.SphereGeometry(.075,12,10),glowMat,0,1.88,-.22);
warriorPart(new THREE.CapsuleGeometry(.13,.42,4,8),lightArmor,-.48,1.42,0,0,0,-.22);
warriorPart(new THREE.CapsuleGeometry(.13,.42,4,8),lightArmor,.48,1.42,0,0,0,.22);
warriorPart(new THREE.SphereGeometry(.2,12,10),armorMat,-.5,1.69,0);
warriorPart(new THREE.SphereGeometry(.2,12,10),armorMat,.5,1.69,0);
warriorPart(new THREE.CapsuleGeometry(.16,.48,4,8),armorMat,-.22,.62,0,0,0,.04);
warriorPart(new THREE.CapsuleGeometry(.16,.48,4,8),armorMat,.22,.62,0,0,0,-.04);
warriorPart(new THREE.BoxGeometry(.34,.18,.48),lightArmor,-.22,.25,-.04);
warriorPart(new THREE.BoxGeometry(.34,.18,.48),lightArmor,.22,.25,-.04);
const core=new THREE.Mesh(new THREE.SphereGeometry(.2,16,12),new THREE.MeshBasicMaterial({color:0xff714b}));core.position.set(0,1.3,-.43);player.add(core);
const swordGrip=warriorPart(new THREE.CylinderGeometry(.045,.045,.34,8),hairMat,.68,.93,-.1,0,0,-.35);
const swordGuard=warriorPart(new THREE.BoxGeometry(.42,.075,.12),lightArmor,.65,1.08,-.1,0,0,-.35);
const sword=new THREE.Mesh(new THREE.BoxGeometry(.12,1.35,.16),new THREE.MeshStandardMaterial({color:0xffa17a,emissive:0x9a2814,emissiveIntensity:1.4,metalness:.7,roughness:.2}));sword.position.set(.65,1.78,-.1);sword.rotation.z=-.35;sword.castShadow=true;player.add(sword);
const slash=new THREE.Mesh(new THREE.TorusGeometry(1.05,.055,8,36,Math.PI*1.25),new THREE.MeshBasicMaterial({color:0xffa477,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));slash.position.set(0,1.15,-.78);slash.rotation.z=-.62;slash.visible=false;player.add(slash);
const impactRing=new THREE.Mesh(new THREE.TorusGeometry(.72,.045,8,32),new THREE.MeshBasicMaterial({color:0xff527b,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));impactRing.rotation.x=Math.PI/2;impactRing.position.y=.08;scene.add(impactRing);let slashLife=0,impactLife=0;
const dummy=new THREE.Group();dummy.position.set(0,0,-6);scene.add(dummy);const dm=new THREE.Mesh(new THREE.CapsuleGeometry(.55,.8,5,10),new THREE.MeshStandardMaterial({color:0x6f3450,emissive:0x2b081b}));dm.position.y=1;dummy.add(dm);const halo=new THREE.Mesh(new THREE.TorusGeometry(.8,.06,8,32),new THREE.MeshBasicMaterial({color:0xff5478}));halo.position.y=2.2;dummy.add(halo);
let moveX=0,moveY=0,dodge=0,attack=0,playerHp=100,enemyHp=100,hitFlash=0,comboStep=0,comboTimer=0,enemyWindup=0,enemyCooldown=1.1,enemyDead=0,playerDead=0;const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');let activePointer=null;
function setStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=42,len=Math.hypot(dx,dy)||1,k=Math.min(1,max/len);moveX=dx/Math.max(r.width/2,1);moveY=-dy/Math.max(r.height/2,1);const x=dx*k,y=dy*k;nub.style.transform='translate('+x+'px,'+y+'px)'}
stick.addEventListener('pointerdown',e=>{activePointer=e.pointerId;stick.setPointerCapture(e.pointerId);setStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===activePointer)setStick(e)});function release(e){if(e.pointerId!==activePointer)return;activePointer=null;moveX=moveY=0;nub.style.transform='translate(0,0)'}stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);
document.querySelector('#dodge').addEventListener('pointerdown',e=>{e.preventDefault();dodge=.28});
const toast=document.querySelector('#toast');const comboLabel=document.querySelector('#combo');const attackButton=document.querySelector('#attack');function updateBars(){document.querySelector('#playerHp').style.width=playerHp+'%';document.querySelector('#enemyHp').style.width=enemyHp+'%'}function showToast(label){toast.textContent=label;toast.style.opacity=1;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.style.opacity=0,380)}attackButton.addEventListener('pointerdown',e=>{e.preventDefault();if(playerDead>0)return;comboStep=comboTimer>0?(comboStep%3)+1:1;comboTimer=.82;attack=.38;slashLife=.26;slash.visible=true;slash.material.color.setHex([0xffa477,0x79dfff,0xffd36b][comboStep-1]);comboLabel.textContent=comboStep>1?'COMBO ×'+comboStep:'';showToast(['SOUL STRIKE','RISING SLASH','SOUL BREAKER'][comboStep-1]);const toEnemy=new THREE.Vector3().subVectors(dummy.position,player.position);const distance=toEnemy.length();toEnemy.y=0;toEnemy.normalize();const facing=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);if(distance<3.15&&facing.dot(toEnemy)>.15&&enemyDead<=0){const damage=[14,18,28][comboStep-1];enemyHp=Math.max(0,enemyHp-damage);dm.material.emissive.setHex(0xff174f);hitFlash=.22;impactRing.position.set(dummy.position.x,.08,dummy.position.z);impactRing.scale.setScalar(.55);impactRing.material.opacity=.95;impactLife=.28;updateBars();if(enemyHp<=0){enemyDead=2.2;showToast('ENEMY DEFEATED')} } });
const clock=new THREE.Clock();let yaw=0;
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);const input=new THREE.Vector3(moveX,0,-moveY);if(input.length()>1)input.normalize();if(input.lengthSq()>.01&&playerDead<=0){yaw=Math.atan2(input.x,-input.z);player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,yaw,1-Math.exp(-12*dt));player.position.addScaledVector(input,dt*(dodge>0?10:4.4))}
if(dodge>0){dodge-=dt;player.position.addScaledVector(new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw)),dt*5)}
if(attack>0){attack-=dt;sword.rotation.x=Math.sin((.38-attack)/.38*Math.PI)*-1.9}else sword.rotation.x=0;
if(slashLife>0){slashLife-=dt;slash.material.opacity=Math.max(0,slashLife/.26);slash.rotation.z=-.62+(1-slashLife/.26)*1.05;slash.scale.setScalar(.82+(1-slashLife/.26)*.38);if(slashLife<=0)slash.visible=false}
if(impactLife>0){impactLife-=dt;impactRing.material.opacity=Math.max(0,impactLife/.28);impactRing.scale.setScalar(1.1+(1-impactLife/.28)*1.25)}
if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0){comboStep=0;comboLabel.textContent=''}}
if(enemyDead>0){enemyDead-=dt;dummy.scale.setScalar(Math.max(.001,enemyDead/2.2));if(enemyDead<=0){enemyHp=100;dummy.position.set(player.position.x+(Math.random()-.5)*3,0,player.position.z-6);dummy.scale.setScalar(1);dm.material.emissive.setHex(0x2b081b);updateBars();enemyCooldown=1.2}}else if(playerDead<=0){
const toward=new THREE.Vector3().subVectors(player.position,dummy.position);toward.y=0;const dist=toward.length();if(dist>1.65){toward.normalize();dummy.position.addScaledVector(toward,dt*2.05);dummy.rotation.y=Math.atan2(-toward.x,toward.z);enemyWindup=0}else{enemyCooldown-=dt;if(enemyWindup<=0&&enemyCooldown<=0){enemyWindup=.62;enemyCooldown=1.75;showToast('ENEMY ATTACK!')}}if(enemyWindup>0){enemyWindup-=dt;if(enemyWindup<=0&&dist<2.15){if(dodge<=0){playerHp=Math.max(0,playerHp-18);updateBars();showToast('SOUL CORE HIT');if(playerHp<=0){playerDead=1.8;showToast('YOU WERE DEFEATED')}}else showToast('DODGE SUCCESS')}}}
if(playerDead>0){playerDead-=dt;if(playerDead<=0){playerHp=100;player.position.set(0,0,0);updateBars();showToast('SOUL REAWAKENED')}}
if(hitFlash>0){hitFlash-=dt;dm.scale.setScalar(1+Math.sin(hitFlash*55)*.12)}else if(enemyDead<=0)dm.material.emissive.setHex(0x2b081b);
const desired=new THREE.Vector3(player.position.x,player.position.y+4.4,player.position.z+7.5);camera.position.lerp(desired,1-Math.exp(-5*dt));camera.lookAt(player.position.x,1.1,player.position.z-1.4);renderer.render(scene,camera)}
animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6))});
</script>
</body></html>
